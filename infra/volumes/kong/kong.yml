_format_version: "2.1"
_transform: true

###############################################################################
# Kong declarative configuration for Supabase self-hosted
# Routes:  /rest/v1/   → PostgREST
#          /auth/v1/   → GoTrue
#          /storage/v1/→ Storage API
#          /meta/v1/   → postgres-meta (internal)
# JWT validation happens inside each service (PostgREST / GoTrue / Storage).
###############################################################################

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SERVICE_ROLE_KEY}

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - Authorization
        - apikey
        - X-Client-Info
      exposed_headers:
        - X-Kong-Upstream-Latency
        - X-Kong-Proxy-Latency
        - X-ForwardedFor
      credentials: true
      max_age: 3600

services:
  # ── PostgREST (REST API) ───────────────────────────────────────────────────
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
          key_names:
            - apikey
            - Authorization

  # ── GoTrue (Auth) ──────────────────────────────────────────────────────────
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
          key_names:
            - apikey
            - Authorization

  # ── Storage ────────────────────────────────────────────────────────────────
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
          key_names:
            - apikey
            - Authorization

  # ── postgres-meta (schema introspection) ───────────────────────────────────
  - name: meta
    url: http://meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
          key_names:
            - apikey
            - Authorization
